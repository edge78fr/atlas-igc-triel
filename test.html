<!doctype html><meta charset=utf-8><pre id=o>...</pre>
<script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>
<script>
(async()=>{const o=document.getElementById('o');
try{
const t=await (await fetch('https://edge78fr.github.io/atlas-igc-triel/WMTSCapabilities.xml')).text();
const caps=new ol.format.WMTSCapabilities().read(t);
const opt=ol.source.WMTS.optionsFromCapabilities(caps,{layer:'triel',matrixSet:'PM'});
const src=new ol.source.WMTS(opt);
const tg=src.getTileGrid();
const url=src.getTileUrlFunction()([17,Math.floor(0),0],1,ol.proj.get('EPSG:3857'));
o.textContent=JSON.stringify({enc:opt.requestEncoding,urls:opt.urls,url,minz:tg.getMinZoom(),maxz:tg.getMaxZoom(),ext:opt.tileGrid.getExtent&&opt.tileGrid.getExtent()},null,1);
}catch(e){o.textContent='ERR '+e}
})();
</script>
