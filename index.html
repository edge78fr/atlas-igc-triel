<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas IGC Triel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#m{height:100%;margin:0}#p{position:absolute;z-index:1000;top:10px;right:10px;background:#fff;padding:10px 12px;border-radius:6px;font:13px system-ui;box-shadow:0 1px 6px #0006;max-width:230px}#p label{display:block;margin:4px 0}#p input[type=range]{width:100%}</style></head><body>
<div id="m"></div>
<div id="p"><b>Atlas IGC Triel</b>
<label><input type="radio" name="b" value="o" checked> Photo aérienne</label>
<label><input type="radio" name="b" value="l"> Relief LiDAR HD</label>
<label><input type="radio" name="b" value="p"> Plan</label>
<label><input type="radio" name="b" value="w"> Fond blanc</label>
<label>Planches <input id="a" type="range" min="0" max="1" step=".05" value="1"></label>
<label><input id="co" type="checkbox" checked> OTAN (Mesnil-le-Roi)</label>
<label><input id="cl" type="checkbox" checked> Louveciennes</label>
<label><input id="ce" type="checkbox" checked> Évecquemont C</label>
<label><input id="cc" type="checkbox" checked> Conflans AT</label>
<label><input id="cp" type="checkbox" checked> Pontoise</label>
<label><input id="cad" type="checkbox"> Cadastre (parcelles IGN)</label>
<div><button data-g="48.9955,2.0075,16">Triel</button> <button data-g="48.9262,2.1135,17">OTAN</button> <button data-g="48.8665,2.1225,17">Louveciennes</button> <button data-g="49.0138,1.9369,17">Évecquemont</button> <button data-g="48.9938,2.1174,17">Conflans</button> <button data-g="49.0543,2.1105,16">Pontoise</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const g=(l,s,f)=>`https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${l}&STYLE=${s}&FORMAT=${f}&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`;
const B={o:L.tileLayer(g('ORTHOIMAGERY.ORTHOPHOTOS','normal','image/jpeg'),{maxZoom:21,maxNativeZoom:18}),
l:L.tileLayer(g('IGNF_LIDAR-HD_MNT_ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW','normal','image/png'),{maxZoom:20,maxNativeZoom:18}),
p:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19}),w:L.tileLayer('data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==',{maxZoom:21})};
const map=L.map('m',{layers:[B.o]}).setView([48.9955,2.0075],16);
const at=L.tileLayer('tiles/{z}/{x}/{y}.png',{minZoom:14,maxZoom:20,maxNativeZoom:18,zIndex:10}).addTo(map);
document.querySelectorAll('[name=b]').forEach(r=>r.onchange=()=>{Object.values(B).forEach(x=>map.removeLayer(x));B[r.value].addTo(map);at.bringToFront();ot.bringToFront();lv.bringToFront();ev.bringToFront();cf.bringToFront();pt.bringToFront()});
const lv=L.tileLayer('louv/{z}/{x}/{y}.png',{minZoom:15,maxZoom:21,maxNativeZoom:19,zIndex:12}).addTo(map);
const ev=L.tileLayer('evec/{z}/{x}/{y}.png',{minZoom:15,maxZoom:21,maxNativeZoom:19,zIndex:13}).addTo(map);
const cf=L.tileLayer('conf/{z}/{x}/{y}.png',{minZoom:15,maxZoom:21,maxNativeZoom:19,zIndex:14}).addTo(map);
const pt=L.tileLayer('pont/{z}/{x}/{y}.png',{minZoom:15,maxZoom:21,maxNativeZoom:19,zIndex:15}).addTo(map);
const ot=L.tileLayer('otan/{z}/{x}/{y}.png',{minZoom:15,maxZoom:21,maxNativeZoom:19,zIndex:11}).addTo(map);
document.getElementById('a').oninput=e=>{at.setOpacity(+e.target.value);ot.setOpacity(+e.target.value);lv.setOpacity(+e.target.value);ev.setOpacity(+e.target.value);cf.setOpacity(+e.target.value);pt.setOpacity(+e.target.value)};
document.getElementById('cl').onchange=e=>e.target.checked?lv.addTo(map):map.removeLayer(lv);
document.getElementById('ce').onchange=e=>e.target.checked?ev.addTo(map):map.removeLayer(ev);
document.getElementById('cc').onchange=e=>e.target.checked?cf.addTo(map):map.removeLayer(cf);
document.getElementById('cp').onchange=e=>e.target.checked?pt.addTo(map):map.removeLayer(pt);
const cd=L.tileLayer(g('CADASTRALPARCELS.PARCELLAIRE_EXPRESS','PCI%20vecteur','image/png'),{maxZoom:21,maxNativeZoom:19,zIndex:50});
document.getElementById('cad').onchange=e=>e.target.checked?cd.addTo(map):map.removeLayer(cd);
document.getElementById('co').onchange=e=>e.target.checked?ot.addTo(map):map.removeLayer(ot);
document.querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>{const [a,c,z]=b.dataset.g.split(',');map.setView([+a,+c],+z)});
</script></body></html>
